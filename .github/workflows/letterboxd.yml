name: Letterboxd
# Every three hours, saves my latest Letterboxd films to data/letterboxd.json (tools/letterboxd.mjs) and
# commits it if anything changed. The About section shows them. Run it by hand from the Actions tab too.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/letterboxd.mjs
      - name: Commit if the list changed
        run: |
          git diff --quiet data/letterboxd.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Letterboxd: latest films" data/letterboxd.json
          git push
