name: Checks
# Runs the Fine Print demo's tests and tests/smoke.mjs, which loads every page in a browser and checks the
# parts shared by several pages or sites (warp.js, the spreadsheet demo, the project panels).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04   # Playwright 1.56 does not support the newer ubuntu-latest image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/fine-print-demo/*.test.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
