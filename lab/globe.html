<!DOCTYPE html>

<style>
/* Prototype: the home page as one globe of data you can turn. A cloud of points assembles into a
   globe; eight bright points on it are the projects. Turn it by dragging, pick a point, and it turns
   to face you and opens that project. */
:root { --bg: #0E0D0C; --bg-2: #151311; --ink: #F2EEE7; --ink2: #C3BCB0; --mut: #8E877B; --line: rgba(242, 238, 231, .14); --amber: #FFB547; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.55 "Inter Tight", system-ui, sans-serif; overflow: hidden; }
a { color: inherit; }
.mono { font: 500 12px/1.5 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
#stage { position: fixed; inset: 0; touch-action: pan-y; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.nav { position: fixed; z-index: 5; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 20px 28px; pointer-events: none; }
.nav > * { pointer-events: auto; }
.nav .name { font-weight: 600; letter-spacing: .02em; text-transform: uppercase; text-decoration: none; }
.nav .links { display: flex; gap: 22px; font-size: 15px; } .nav .links a { text-decoration: none; color: var(--ink2); } .nav .links a:hover { color: var(--amber); }
.intro { position: fixed; z-index: 4; left: 28px; top: 92px; max-width: 430px; pointer-events: none; transition: opacity .5s, transform .5s; }
.intro > * { pointer-events: auto; }
.intro h1 { margin: 10px 0 12px; font: 500 clamp(38px, 5vw, 70px)/.98 "Inter Tight"; letter-spacing: -.04em; }
.intro h1 i { color: var(--amber); }
.intro p { margin: 0; color: var(--ink2); font-size: 16.5px; }
.intro .mono { color: var(--amber); }
.roles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.roles button { font: 500 13.5px "Inter Tight"; color: var(--ink); background: rgba(14, 13, 12, .5); border: 1px solid var(--line); padding: 7px 11px; cursor: pointer; }
.roles button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); background: rgba(255, 181, 71, .12); }
body.open .intro { opacity: 0; transform: translateX(-20px); pointer-events: none; }
body.open .intro > * { pointer-events: none; }
/* project markers: HTML buttons pinned to their points on the globe */
.mk { position: fixed; z-index: 3; left: 0; top: 0; background: none; border: 0; padding: 6px; color: var(--ink); font: 500 14px "Inter Tight"; cursor: pointer;
  display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: opacity .3s; will-change: transform; }
.mk i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--amber); background: rgba(14, 13, 12, .6); box-shadow: 0 0 12px rgba(255, 181, 71, .7); flex: none; }
.mk span { text-shadow: 0 0 8px var(--bg), 0 0 3px var(--bg); }
.mk small { font: 500 10.5px "JetBrains Mono"; color: var(--mut); }
.mk.back { opacity: .16; pointer-events: none; }
.mk.off { opacity: 0; visibility: hidden; pointer-events: none; }
.mk.on i { background: var(--amber); transform: scale(1.3); }
.mk.on span { color: var(--amber); }
.mk.dim { opacity: .35; }
.mk:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; }
/* the bottom bar: hint, the eight names, arrows */
.bar { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px; padding: 16px 28px 22px; pointer-events: none; }
.bar > * { pointer-events: auto; }
.hint { color: var(--mut); }
.hint b { color: var(--amber); font-weight: 500; }
.names { display: flex; gap: 12px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.names button { all: unset; cursor: pointer; font: 500 12px "JetBrains Mono"; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); }
.names button.on, .names button:hover { color: var(--amber); }
.arrows { display: flex; gap: 8px; }
.arrows button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: rgba(14, 13, 12, .6); color: var(--ink); font-size: 18px; cursor: pointer; }
.arrows button:hover { border-color: var(--amber); color: var(--amber); }
/* the project file */
.file { position: fixed; z-index: 6; right: 24px; top: 84px; bottom: 84px; width: min(420px, 38vw); padding: 20px 20px 18px; overflow: auto;
  background: rgba(14, 13, 12, .9); border: 1px solid rgba(255, 181, 71, .3); transform: translateX(calc(100% + 40px)); opacity: 0;
  transition: transform .6s cubic-bezier(.2, .8, .2, 1), opacity .4s; }
.file::before { content: ""; position: absolute; top: -1px; right: -1px; width: 24px; height: 24px; border: 2px solid var(--amber); border-left: 0; border-bottom: 0; }
body.open .file { transform: none; opacity: 1; }
.file .top { display: flex; justify-content: space-between; color: var(--amber); }
.file .top button { all: unset; cursor: pointer; color: var(--mut); font-size: 20px; line-height: 1; }
.file h2 { margin: 10px 0 6px; font: 500 34px/1 "Inter Tight"; letter-spacing: -.03em; }
.file p { margin: 0 0 12px; color: var(--ink2); font-size: 15.5px; }
.file .proof { display: flex; gap: 12px; align-items: baseline; margin-bottom: 12px; }
.file .proof b { font: 500 32px/1 "Inter Tight"; color: var(--amber); }
.file .proof span { font-size: 14px; color: var(--ink2); }
.file .shot { position: relative; display: block; aspect-ratio: 16 / 10; border: 1px solid var(--line); overflow: hidden; background: #1a1816; }
.file .shot video, .file .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.file .stack { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0; }
.file .stack span { font: 500 11px "JetBrains Mono"; border: 1px solid rgba(255, 181, 71, .35); padding: 2px 7px; }
.file .go { display: flex; flex-wrap: wrap; gap: 8px; }
.file .go a { font: 600 12.5px "Inter Tight"; letter-spacing: .05em; text-transform: uppercase; text-decoration: none; padding: 10px 13px; border: 1px solid var(--line); }
.file .go a:first-child { background: var(--amber); color: #1A1510; border-color: var(--amber); }
.file > * { transition: opacity .25s, transform .25s; }
.file.swap > * { opacity: 0; transform: translateY(8px); }
.lab { position: fixed; z-index: 7; right: 12px; top: 64px; color: var(--mut); font-size: 10.5px; }
@media (max-width: 900px) {
  .nav { padding: 14px 16px; } .nav .links { gap: 14px; font-size: 14px; }
  .intro { left: 16px; right: 16px; top: 64px; max-width: none; }
  .intro h1 { font-size: 36px; } .intro p { font-size: 15px; }
  .bar { padding: 10px 16px 18px; flex-wrap: wrap; }
  .names { display: none; }
  .arrows { margin-left: auto; }
  .mk { font-size: 12.5px; padding: 8px; } .mk small { display: none; }
  .file { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 62svh; border-left: 0; border-right: 0; border-bottom: 0;
    transform: translateY(100%); padding: 16px 16px 22px; }
  body.open .bar { opacity: 0; pointer-events: none; }
  .file h2 { font-size: 28px; }
  .lab { display: none; }
}
@media (prefers-reduced-motion: reduce) { .file, .intro, .mk { transition: none; } }
</style>
</head>
<body>
<div id="stage" aria-label="A globe of the eight projects. Drag to turn it."></div>
<header class="nav"><a class="name" href="../index.html">Lekan Lawal</a><nav class="links"><a href="../index.html#about">About</a><a href="../resume.html">Résumé</a><a href="../index.html#contact">Contact</a></nav></header>
<span class="lab mono">Prototype</span>

<section class="intro" id="intro">
  <span class="mono">Data, BI and AI · Canada</span>
  <h1>Messy data in.<br><i>Trusted</i> tools out.</h1>
  <p>Eight tools that check their own work. Turn the globe and pick a point, or tell me what you're hiring for.</p>
  <div class="roles" role="group" aria-label="Hiring for">
    <button type="button" data-role="analyst" aria-pressed="false">Data analyst</button><button type="button" data-role="bi" aria-pressed="false">BI</button><button type="button" data-role="ai" aria-pressed="false">AI engineer</button><button type="button" data-role="ops" aria-pressed="false">Operations</button>
  </div>
</section>

<div class="bar">
  <span class="hint mono" id="hint"><b>Drag</b> to turn · <b>pick</b> a point</span>
  <div class="names" id="names"></div>
  <div class="arrows"><button type="button" id="prev" aria-label="Previous project">←</button><button type="button" id="next" aria-label="Next project">→</button></div>
</div>

<aside class="file" id="file" aria-live="polite"></aside>

<script src="../projects.js"></script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const small = () => innerWidth <= 900;
const P = window.PROJECTS;
const pad = (i) => String(i + 1).padStart(2, "0");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SALES = [14237, 4520, 55691, 28014, 23648, 34595, 33946, 27909, 81777, 31453, 78629, 69546, 18174, 11951, 38726, 34195, 30132, 24797, 28765, 36898, 64596, 31405, 75973, 74920,
  18542, 22979, 51716, 38750, 56988, 40345, 39262, 31115, 73410, 59688, 79412, 96999, 43971, 20301, 58872, 36522, 44261, 52982, 45264, 63121, 87867, 77777, 118448, 83829];

// ---------------------------------------------------------------- the globe, built from points
const R = 2.6, S = small();
const pos = [], from = [], kind = [], seed = [];
const rnd = (a, b) => a + Math.random() * (b - a);
function add(x, y, z, k) {
  pos.push(x, y, z); kind.push(k); seed.push(Math.random());
  // every point starts somewhere in a messy cloud, and the globe assembles out of it
  const th = Math.random() * 6.283, ph = Math.acos(2 * Math.random() - 1), r = Math.cbrt(Math.random()) * 7;
  from.push(r * Math.sin(ph) * Math.cos(th) * 1.4, r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));
}
const F = S ? 0.55 : 1;
// 1. the shell: an even scatter over the sphere
const NS = Math.round(2600 * F), ga = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < NS; i++) { const y = 1 - (i / (NS - 1)) * 2, r = Math.sqrt(1 - y * y), t = ga * i; add(Math.cos(t) * r * R, y * R, Math.sin(t) * r * R, 0); }
// 2. latitude bands, dense and slightly broken, like scan lines
for (const lat of [-62, -38, -14, 14, 38, 62]) {
  const y = Math.sin(lat * Math.PI / 180) * R, rr = Math.cos(lat * Math.PI / 180) * R, n = Math.round(rr * 150 * F);
  for (let i = 0; i < n; i++) { const t = (i / n) * 6.283; if (Math.sin(t * 9 + lat) > 0.75) continue; add(Math.cos(t) * rr, y + rnd(-.02, .02), Math.sin(t) * rr, 1); }
}
// 3. the equator carries the data: 48 months of a real store's sales as bars standing off the surface
for (let m = 0; m < 48; m++) {
  const t = (m / 48) * 6.283, h = 0.15 + (SALES[m] / 118448) * 0.95, n = Math.round(26 * F);
  for (let j = 0; j < n; j++) { const rr = R + (j / n) * h; add(Math.cos(t) * rr, rnd(-.025, .025), Math.sin(t) * rr, 2); }
}
// 4. two tilted orbit rings with tick marks
for (const [rr, tilt] of [[R * 1.32, 0.42], [R * 1.5, -0.3]]) {
  const n = Math.round(700 * F);
  for (let i = 0; i < n; i++) { const t = (i / n) * 6.283, tick = i % 35 === 0;
    for (let q = 0; q < (tick ? 6 : 1); q++) { const r2 = rr + (tick ? q * 0.03 : 0), x = Math.cos(t) * r2, z = Math.sin(t) * r2; add(x, z * Math.sin(tilt), z * Math.cos(tilt), 3); } }
}
// 5. a bright core
for (let i = 0; i < Math.round(900 * F); i++) { const th = Math.random() * 6.283, ph = Math.acos(2 * Math.random() - 1), r = Math.pow(Math.random(), 2) * 0.9;
  add(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th), 4); }

const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
geo.setAttribute("aFrom", new THREE.Float32BufferAttribute(from, 3));
geo.setAttribute("aKind", new THREE.Float32BufferAttribute(kind, 1));
geo.setAttribute("aSeed", new THREE.Float32BufferAttribute(seed, 1));
const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uT: { value: 0 }, uIn: { value: reduce ? 1 : 0 }, uSize: { value: (S ? 3.4 : 4.2) * Math.min(devicePixelRatio, 2) }, uFocus: { value: new THREE.Vector3(0, 0, 1) }, uLit: { value: 0 } },
  vertexShader: `attribute vec3 aFrom; attribute float aKind, aSeed; uniform float uT, uIn, uSize, uLit; uniform vec3 uFocus; varying float vA; varying float vK;
    void main() {
      float e = smoothstep(0., 1., clamp(uIn * 1.6 - aSeed * .6, 0., 1.));
      vec3 p = mix(aFrom, position, e);
      if (aKind < .5) p *= 1. + .012 * sin(uT * 1.3 + aSeed * 40.);
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      gl_Position = projectionMatrix * mv;
      // points on the far side fade; points near the chosen project brighten
      vec3 wp = (modelMatrix * vec4(p, 1.)).xyz;
      float front = smoothstep(-2.6, 1.4, wp.z);
      float near = uLit * smoothstep(1.4, 0., distance(normalize(wp), uFocus)) * step(aKind, 1.5);
      float tw = .6 + .4 * sin(uT * 2. + aSeed * 50.);
      vA = (aKind > 3.5 ? .9 : aKind > 2.5 ? .45 : aKind > 1.5 ? .95 : aKind > .5 ? .7 : .38) * (.25 + .75 * front) * tw + near * .8;
      vK = aKind;
      gl_PointSize = uSize * (aKind > 3.5 ? 1.2 : aKind > 1.5 ? 1. : .8) * (1. + near * .8) * (10. / -mv.z);
    }`,
  fragmentShader: `varying float vA; varying float vK; void main() { vec2 c = gl_PointCoord - .5; float d = length(c); if (d > .5) discard;
    float a = smoothstep(.5, 0., d); vec3 col = mix(vec3(1., .5, .12), vec3(1., .9, .7), a * a * (vK > 3.5 ? 1. : .6)); gl_FragColor = vec4(col, a * vA); }` });

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const globe = new THREE.Group(); scene.add(globe);
globe.add(new THREE.Points(geo, mat));
// a soft glow behind it
const glow = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
  vertexShader: `varying vec2 vU; void main() { vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `varying vec2 vU; void main() { float d = distance(vU, vec2(.5)); gl_FragColor = vec4(1., .5, .12, smoothstep(.36, 0., d) * .22); }` }));
glow.position.z = -3; scene.add(glow);

// ---------------------------------------------------------------- the eight projects on its surface
const spots = P.map((p, i) => {
  const lat = [28, -18, 44, -40, 8, -6, 52, -30][i] * Math.PI / 180, lon = (i / P.length) * Math.PI * 2 + 0.3;
  return new THREE.Vector3(Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)).multiplyScalar(R);
});
const marks = P.map((p, i) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "mk";
  b.innerHTML = `<i></i><span>${esc(p.name)}</span><small>${pad(i)}</small>`;
  b.setAttribute("aria-label", `${p.name}: open project ${i + 1} of ${P.length}`);
  b.addEventListener("click", () => open(i)); document.body.appendChild(b); return b;
});
document.getElementById("names").innerHTML = P.map((p, i) => `<button type="button" data-i="${i}">${esc(p.name.split(" ").slice(-1)[0])}</button>`).join("");
document.getElementById("names").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) open(+b.dataset.i); });

// ---------------------------------------------------------------- turning it
// The globe's turn is a yaw and a pitch with momentum. Dragging sideways turns it; on a phone an
// up-and-down drag still scrolls the page.
let yaw = 0.4, pitch = 0.18, vy = 0, vp = 0, dragging = false, lx = 0, ly = 0, lastInput = 0, target = null;
stage.addEventListener("pointerdown", (e) => { dragging = true; lx = e.clientX; ly = e.clientY; target = null; stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId); lastInput = performance.now(); });
stage.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
  vy = dx * 0.0055; vp = e.pointerType === "touch" ? 0 : dy * 0.004;
  yaw += vy; pitch = Math.max(-0.9, Math.min(0.9, pitch + vp)); lastInput = performance.now();
});
const end = () => { dragging = false; stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
stage.addEventListener("wheel", (e) => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { vy = -e.deltaX * 0.002; lastInput = performance.now(); } }, { passive: true });

// ---------------------------------------------------------------- opening a project
const file = document.getElementById("file");
let cur = -1;
function angleFor(i) {
  // the yaw and pitch that bring this project's point round to face you
  // turn about the vertical axis until the point is straight ahead, then tip it level
  const v = spots[i].clone().normalize(), yw = Math.atan2(-v.x, v.z), zr = Math.hypot(v.x, v.z);
  return { yaw: yw, pitch: Math.atan2(v.y, zr) };
}
function open(i) {
  i = (i + P.length) % P.length;
  const swap = cur >= 0 && document.body.classList.contains("open");
  cur = i;
  const a = angleFor(i);
  // the shortest way round
  let dy = a.yaw - yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  target = { yaw: yaw + dy, pitch: a.pitch }; vy = 0; vp = 0;
  marks.forEach((m, k) => m.classList.toggle("on", k === i));
  document.querySelectorAll("#names button").forEach((b, k) => b.classList.toggle("on", k === i));
  const render = () => {
    const p = P[i];
    file.innerHTML = `<div class="top mono"><span>File ${pad(i)} // ${esc(p.kind)}</span><button type="button" id="close" aria-label="Close">&times;</button></div>
      <h2>${esc(p.name)}</h2><p>${esc(p.line)}</p>
      <div class="proof"><b>${esc(p.proof[0])}</b><span>${esc(p.proof[1])}</span></div>
      <a class="shot" href="${p.live[1].startsWith("http") ? p.live[1] : "../" + p.live[1]}">${reduce ? `<img src="../${p.img}" alt="">` : `<video src="../assets/previews/${p.id}.mp4" autoplay muted loop playsinline aria-hidden="true"></video>`}</a>
      <div class="stack">${p.skills.map((s) => `<span>${esc(s)}</span>`).join("")}</div>
      <div class="go"><a href="${p.live[1].startsWith("http") ? p.live[1] : "../" + p.live[1]}">${esc(p.live[0])} ↗</a><a href="../${p.study}">Case study</a></div>`;
    file.querySelector("#close").addEventListener("click", close);
    file.classList.remove("swap");
  };
  if (swap && !reduce) { file.classList.add("swap"); setTimeout(render, 220); } else render();
  document.body.classList.add("open");
  mat.uniforms.uLit.value = 1;
}
function close() { document.body.classList.remove("open"); marks.forEach((m) => m.classList.remove("on")); cur = -1; mat.uniforms.uLit.value = 0; }
document.getElementById("prev").addEventListener("click", () => open(cur < 0 ? P.length - 1 : cur - 1));
document.getElementById("next").addEventListener("click", () => open(cur < 0 ? 0 : cur + 1));
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") open(cur + 1); if (e.key === "ArrowLeft") open(cur - 1); if (e.key === "Escape") close();
});

// hiring for: dims the projects that fit less, and turns to the best fit
const ROLES = { analyst: ["economy", "superstore", "football"], bi: ["superstore", "economy", "discrepancy"], ai: ["fine-print", "sorted", "football"], ops: ["discrepancy", "superstore", "docket"] };
document.querySelectorAll("[data-role]").forEach((b) => b.addEventListener("click", () => {
  const fit = ROLES[b.dataset.role];
  document.querySelectorAll("[data-role]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  marks.forEach((m, k) => m.classList.toggle("dim", !fit.includes(P[k].id)));
  open(P.findIndex((p) => p.id === fit[0]));
}));

// ---------------------------------------------------------------- every frame
const size = () => {
  renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight;
  cam.position.set(0, 0, small() ? 15.5 : 9.6); cam.updateProjectionMatrix();
};
size(); let lastW = innerWidth; addEventListener("resize", () => { if (small() && innerWidth === lastW) return; lastW = innerWidth; size(); });
const t0 = performance.now(), v = new THREE.Vector3(), focus = new THREE.Vector3();
function frame(now) {
  const t = (now - t0) / 1000;
  mat.uniforms.uT.value = t;
  if (!reduce) mat.uniforms.uIn.value = Math.min(1, t / 2.4);
  if (target) {
    yaw += (target.yaw - yaw) * 0.075; pitch += (target.pitch - pitch) * 0.075;
    if (Math.abs(target.yaw - yaw) < 0.002 && Math.abs(target.pitch - pitch) < 0.002) target = null;
  } else if (!dragging) {
    yaw += vy; vy *= 0.94;
    if (now - lastInput > 2500 && cur < 0 && !reduce) yaw += 0.0016;   // idle: a slow turn
  }
  globe.rotation.set(pitch, yaw, 0, "XYZ");
  // on a phone the globe sits a little higher; with a project open on a laptop, it moves left to make room
  const gx = !small() && document.body.classList.contains("open") ? -1.6 : (!small() ? 0.9 : 0), gy = small() ? (document.body.classList.contains("open") ? 3.4 : -1.9) : 0;
  globe.position.x += (gx - globe.position.x) * 0.06; globe.position.y += (gy - globe.position.y) * 0.06;
  glow.position.x = globe.position.x; glow.position.y = globe.position.y;
  globe.updateMatrixWorld();
  // pin each marker's button to its point; markers round the back fade out
  spots.forEach((s, i) => {
    v.copy(s).applyMatrix4(globe.matrixWorld);
    const back = v.z < globe.position.z - 0.3 || mat.uniforms.uIn.value < 0.9;
    v.project(cam);
    const sx = (v.x + 1) / 2 * innerWidth, sy = (1 - v.y) / 2 * innerHeight;
    // labels stay out from under the menu, the bottom bar, the open file and the screen's edges
    const open = document.body.classList.contains("open");
    const bottom = small() && open ? innerHeight * 0.36 : innerHeight - 76;
    const hidden = sy < 64 || sy > bottom || sx < 6 || sx > innerWidth - (small() ? 96 : 120) || (!small() && open && sx > innerWidth - 470);
    marks[i].style.transform = `translate(${(sx - 12).toFixed(1)}px, ${(sy - 14).toFixed(1)}px)`;
    marks[i].classList.toggle("back", back);
    marks[i].classList.toggle("off", hidden);
  });
  if (cur >= 0) { focus.copy(spots[cur]).applyMatrix4(globe.matrixWorld).sub(globe.position).normalize(); mat.uniforms.uFocus.value.copy(focus); }
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
